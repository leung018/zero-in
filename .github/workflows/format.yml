name: Format Check

on:
  pull_request:
    branches:
      - main

jobs:
  check-format:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'yarn'
          cache-dependency-path: yarn.lock
      - name: Install formatters
        run: |
          brew install ktlint swiftformat
      - run: yarn install --immutable
      - name: Run Formatter Check
        id: format-check
        run: yarn format-check
      - name: Remind to upgrade local formatters
        if: failure() && steps.format-check.outcome == 'failure'
        run: |
          echo "::warning title=Passes locally?::CI uses swiftformat $(swiftformat --version) and $(ktlint --version). Run: brew upgrade swiftformat ktlint, then yarn format, then commit."
