name: Firestore Continuous Integration
on:
  pull_request:
    paths:
      - 'apps/firebase/firestore.**'
      - 'apps/firebase/firestore-tests/**'
      - '.github/workflows/firestore-dev.yml'
      - '.github/actions/deploy-firestore-rules/**'
  workflow_dispatch:
jobs:
  test-rules-and-deploy-dev-firestore:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/firebase
    environment: dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'yarn'
          cache-dependency-path: yarn.lock
      - run: yarn install --immutable
      - run: yarn test-firestore
      - name: Deploy Firestore Rules
        uses: ./.github/actions/deploy-firestore-rules
        with:
          project-id: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          gcp-sa-key: ${{ secrets.GCP_SA_KEY }}
