name: Deploy to Production Firestore
on:
  push:
    branches:
      - main
    paths:
      - 'apps/firebase/firestore.**'
      - '.github/workflows/firestore-prod.yml'
      - '.github/actions/deploy-firestore-rules/**'
jobs:
  deploy-prod-firestore:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/firebase
    environment: prod
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'yarn'
          cache-dependency-path: yarn.lock
      - run: yarn install --immutable
      - name: Deploy Firestore Rules
        uses: ./.github/actions/deploy-firestore-rules
        with:
          project-id: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
